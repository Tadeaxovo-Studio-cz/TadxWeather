<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TadxWeather">
<title>TadxWeather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --txt:#fff;--muted:rgba(255,255,255,.64);--faint:rgba(255,255,255,.52);
  --glass:rgba(255,255,255,.085);--glass-b:rgba(255,255,255,.14);
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Outfit',system-ui,-apple-system,sans-serif;color:var(--txt);background:#0b1026;overflow-x:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:-4;opacity:0;transition:opacity 1.4s var(--ease)}
.t-clear-day{background:linear-gradient(165deg,#1f63d6 0%,#4b9df2 48%,#f7b56d 118%)}
.t-clear-night{background:linear-gradient(172deg,#05081a 0%,#121a4a 55%,#3b2a6e 125%)}
.t-cloudy-day{background:linear-gradient(165deg,#43566f 0%,#7a8fab 58%,#b9c5d6 125%)}
.t-cloudy-night{background:linear-gradient(172deg,#0d1119 0%,#222b3b 58%,#3b4558 125%)}
.t-rain{background:linear-gradient(172deg,#16233a 0%,#2f4a6a 58%,#58738f 125%)}
.t-snow{background:linear-gradient(172deg,#5776a0 0%,#94b2d3 55%,#e3ecf5 125%)}
.t-storm{background:linear-gradient(172deg,#0b0819 0%,#271c48 55%,#4c3b6e 125%)}
.t-fog{background:linear-gradient(172deg,#545e6b 0%,#87909c 58%,#bcc3ca 125%)}
.orb{position:fixed;border-radius:50%;filter:blur(60px);z-index:-3;opacity:.45;pointer-events:none;transition:background 1.4s}
.orb.o1{width:340px;height:340px;top:-90px;right:-110px;background:rgba(255,214,140,.55);animation:orb1 18s ease-in-out infinite alternate}
.orb.o2{width:300px;height:300px;bottom:-60px;left:-120px;background:rgba(120,160,255,.45);animation:orb2 22s ease-in-out infinite alternate}
@keyframes orb1{to{transform:translate(-70px,120px) scale(1.15)}}
@keyframes orb2{to{transform:translate(90px,-140px) scale(1.2)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:-1;pointer-events:none}
#flash.on{animation:bolt .7s ease-out}
@keyframes bolt{0%{opacity:0}8%{opacity:.35}16%{opacity:.05}24%{opacity:.22}100%{opacity:0}}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1b2a6b,#070b1f 70%);transition:opacity .8s var(--ease),visibility .8s}
#splash.out{opacity:0;visibility:hidden}
.sp-in{text-align:center}
.sp-logo{width:110px;height:110px;margin:0 auto 18px;animation:pop 1s var(--spring) both}
.sp-name{font-size:32px;font-weight:600;letter-spacing:-.5px}
.sp-name span{display:inline-block;opacity:0;transform:translateY(14px);animation:up .7s var(--ease) forwards}
.sp-name b{font-weight:600;background:linear-gradient(90deg,#ffd27a,#ff9f6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-bar{width:120px;height:3px;border-radius:3px;margin:22px auto 0;background:rgba(255,255,255,.12);overflow:hidden}
.sp-bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#8ec5ff,#ffd27a);animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}

/* ---------- layout ---------- */
.app{max-width:480px;margin:0 auto;padding:calc(var(--st) + 12px) 18px calc(var(--sb) + 30px)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:48px;position:sticky;top:0;z-index:5}
.top::before{content:"";position:absolute;inset:calc(-12px - var(--st)) -18px -6px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:rgba(10,14,30,.08);opacity:var(--hdr,0);transition:opacity .3s;z-index:-1;mask:linear-gradient(#000 70%,transparent)}
.iconbtn{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .35s var(--spring),background .3s}
.iconbtn:active{transform:scale(.88)}
.iconbtn svg{width:20px;height:20px}
.brand{font-weight:600;font-size:17px;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
.brand svg{width:24px;height:24px}
.brand b{font-weight:600;background:linear-gradient(90deg,#ffd27a,#ff9f6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.unit{font-weight:600;font-size:15px;perspective:300px}
.unit span{display:inline-block;transition:transform .5s var(--spring)}
.unit.flip span{transform:rotateX(360deg)}

.banner{margin:12px 0 0;padding:11px 14px;border-radius:16px;font-size:13px;line-height:1.4;color:rgba(255,255,255,.9);background:rgba(255,190,90,.16);border:1px solid rgba(255,200,120,.3);display:flex;gap:10px;align-items:flex-start;animation:up .6s var(--ease) both}
.banner svg{flex:none;width:18px;height:18px;margin-top:1px;color:#ffd27a}
.hidden{display:none!important}

/* hero */
.hero{text-align:center;padding:22px 0 26px;position:relative}
.place{display:inline-flex;align-items:center;gap:8px;font-size:30px;font-weight:500;letter-spacing:-.6px;line-height:1.1;max-width:100%}
.place .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;position:relative;flex:none;transition:transform .4s var(--spring)}
.fav:active{transform:scale(.8)}
.fav svg{width:22px;height:22px;transition:fill .3s,color .3s,transform .5s var(--spring)}
.fav.on svg{fill:#ffd27a;color:#ffd27a;transform:rotate(72deg) scale(1.1)}
.fav .burst{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.fav.pulse .burst{animation:burst .6s var(--ease)}
@keyframes burst{0%{box-shadow:0 0 0 0 rgba(255,210,122,.7)}100%{box-shadow:0 0 0 18px rgba(255,210,122,0)}}
.date{color:var(--muted);font-size:15px;margin-top:6px}
.hero-icon{width:170px;height:170px;margin:4px auto -10px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.25))}
.hero-icon svg{width:100%;height:100%;animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.temp{font-size:112px;font-weight:200;line-height:1;letter-spacing:-6px;display:inline-flex;align-items:flex-start;padding-left:22px;background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.6));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.temp sup{font-size:56px;font-weight:200;margin-top:8px;letter-spacing:0}
.cond{font-size:21px;font-weight:400;margin-top:4px}
.hl{color:var(--muted);font-size:16px;margin-top:6px;display:flex;gap:14px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:500;background:var(--glass);border:1px solid var(--glass-b);color:var(--muted)}

/* cards */
.card{background:var(--glass);border:1px solid var(--glass-b);border-radius:26px;padding:16px 16px;margin-bottom:14px;backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.card-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
.card-h svg{width:15px;height:15px}
.summary{font-size:15px;line-height:1.45;color:rgba(255,255,255,.88);padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1)}

.hours{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.h{flex:none;width:58px;scroll-snap-align:start;text-align:center;padding:10px 0 12px;border-radius:20px;opacity:0;animation:sl .6s var(--ease) forwards;animation-delay:calc(var(--i)*35ms + 200ms)}
.h.now{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18)}
.h .t{font-size:13px;color:var(--muted);font-weight:500}
.h.now .t{color:#fff}
.h svg{width:36px;height:36px;margin:6px auto 4px;display:block}
.h .v{font-size:17px;font-weight:500}
.h .p{font-size:11px;color:#8fd0ff;height:14px;font-weight:500}
@keyframes sl{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

.day{display:grid;grid-template-columns:52px 34px 36px 34px 1fr 34px;align-items:center;gap:6px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);opacity:0;animation:up .6s var(--ease) forwards;animation-delay:calc(var(--i)*55ms + 250ms)}
.day:first-of-type{border-top:0}
.day .dn{font-size:16px;font-weight:500}
.day svg{width:32px;height:32px}
.day .pp{font-size:12px;color:#8fd0ff;font-weight:500}
.day .lo{color:var(--faint);text-align:right;font-size:16px}
.day .hi{text-align:right;font-size:16px;font-weight:500}
.track{height:6px;border-radius:6px;background:rgba(0,0,0,.18);position:relative;overflow:visible}
.track i{position:absolute;top:0;bottom:0;border-radius:6px;transform-origin:left;transform:scaleX(0);animation:grow 1s var(--ease) forwards;animation-delay:calc(var(--i)*55ms + 450ms)}
.track b{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.25);box-shadow:0 0 0 3px rgba(255,255,255,.18);opacity:0;animation:fade .4s 1.3s forwards}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes fade{to{opacity:1}}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid .card{margin:0;min-height:140px;display:flex;flex-direction:column}
.grid .card.wide{grid-column:span 2;min-height:0}
.big{font-size:32px;font-weight:400;letter-spacing:-.5px}
.big small{font-size:16px;color:var(--muted);margin-left:3px;letter-spacing:0}
.note{font-size:13px;color:var(--muted);margin-top:auto;padding-top:8px;line-height:1.35}
.meter{height:6px;border-radius:6px;margin-top:12px;position:relative;background:rgba(0,0,0,.2)}
.meter.uv{background:linear-gradient(90deg,#5fd27a,#f5d94a,#ff9b43,#ff5a5a,#b46cff)}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:linear-gradient(90deg,#7cc4ff,#a3e0ff);width:var(--w);transform-origin:left;transform:scaleX(0);animation:grow 1.2s .5s var(--ease) forwards}
.meter b{position:absolute;top:50%;left:var(--w);width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.18);opacity:0;animation:fade .5s 1s forwards}
.compass{display:flex;align-items:center;gap:12px}
.dial{width:56px;height:56px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);position:relative;flex:none}
.dial::after{content:"S";position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--faint)}
.dial svg{position:absolute;inset:8px;width:40px;height:40px;transform:rotate(0);transition:transform 1.6s var(--spring)}
.sunarc{width:100%;height:auto;display:block;margin-top:4px}
.sunrow{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:4px}
.sunrow b{display:block;color:#fff;font-size:20px;font-weight:500}
.arcpath{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:dash 1.6s .4s var(--ease) forwards}
@keyframes dash{to{stroke-dashoffset:var(--off)}}
.sundot{opacity:0;animation:fade .6s 1.6s forwards}

.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:22px;line-height:1.7}
.foot button{color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-b);font-size:13px;transition:transform .3s var(--spring)}
.foot button:active{transform:scale(.92)}
.foot button svg{width:14px;height:14px}
.foot button.spin svg{animation:spin .8s linear infinite}

.reveal{opacity:0;transform:translateY(22px)}
main.in .reveal{animation:up .9s var(--ease) forwards;animation-delay:calc(var(--i,0)*80ms)}
@keyframes up{to{opacity:1;transform:none}}

/* skeleton */
.sk{position:relative;overflow:hidden;background:rgba(255,255,255,.08);border-radius:12px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);animation:shim 1.2s infinite}
@keyframes shim{to{transform:translateX(100%)}}

/* ---------- search sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;visibility:hidden;pointer-events:none}
.sheet.open{visibility:visible;pointer-events:auto}
.sheet-bd{position:absolute;inset:0;background:rgba(5,8,20,.45);backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);opacity:0;transition:opacity .45s var(--ease),backdrop-filter .45s}
.sheet.open .sheet-bd{opacity:1;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel{position:absolute;left:0;right:0;bottom:0;top:calc(var(--st) + 26px);max-width:480px;margin:0 auto;border-radius:30px 30px 0 0;background:rgba(18,22,40,.82);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border:1px solid rgba(255,255,255,.1);border-bottom:0;transform:translateY(105%);transition:transform .55s var(--ease);display:flex;flex-direction:column;padding:10px 18px 0}
.sheet.open .panel{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.srow{display:flex;gap:10px;align-items:center}
.sbar{flex:1;display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:17px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);transition:border-color .3s,background .3s,box-shadow .3s}
.sbar:focus-within{border-color:rgba(142,197,255,.6);background:rgba(255,255,255,.12);box-shadow:0 0 0 4px rgba(142,197,255,.12)}
.sbar svg{width:19px;height:19px;color:var(--muted);flex:none}
.sbar input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px}
.sbar input::placeholder{color:var(--faint)}
.clr{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:14px;transform:scale(0);transition:transform .3s var(--spring)}
.clr.show{transform:scale(1)}
.cancel{color:#8ec5ff;font-size:16px;font-weight:500;padding:8px 2px}
.results{flex:1;overflow-y:auto;padding:14px 0 calc(var(--sb) + 20px);-webkit-overflow-scrolling:touch}
.sec{font-size:12px;font-weight:500;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);margin:14px 4px 8px}
.res{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:12px 12px;border-radius:18px;transition:background .25s,transform .3s var(--spring);opacity:0;animation:up .5s var(--ease) forwards;animation-delay:calc(var(--i)*40ms);transform:translateY(12px)}
.res:active{transform:scale(.97);background:rgba(255,255,255,.08)}
.res:hover{background:rgba(255,255,255,.06)}
.flag{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.08);flex:none}
.res .n{font-size:17px;font-weight:500}
.res .s{font-size:13px;color:var(--muted);margin-top:1px}
.res .go{margin-left:auto;color:var(--faint)}
.res .go svg{width:18px;height:18px}
.loc{background:linear-gradient(135deg,rgba(142,197,255,.18),rgba(255,210,122,.12));border:1px solid rgba(142,197,255,.25)}
.loc .flag{background:rgba(142,197,255,.25);color:#cfe7ff}
.loc .flag svg{width:20px;height:20px}
.empty{text-align:center;color:var(--muted);padding:50px 20px;animation:up .5s var(--ease) both}
.empty svg{width:56px;height:56px;opacity:.5;margin-bottom:10px}
.skrow{height:66px;margin:6px 0;border-radius:18px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 26px);transform:translate(-50%,30px);opacity:0;z-index:80;padding:12px 18px;border-radius:16px;background:rgba(20,24,44,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);font-size:14px;transition:all .45s var(--spring);pointer-events:none;max-width:88vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- icon animations ---------- */
.ic .rays{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
.ic .core{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
.ic .cloud{animation:drift 5s ease-in-out infinite alternate}
.ic .cloud.slow{animation-duration:8s;animation-direction:alternate-reverse}
.ic .drop{animation:drop 1s linear infinite;opacity:0}
.ic .flake{animation:flake 2.4s linear infinite;opacity:0}
.ic .bolt{animation:flash 2.8s infinite}
.ic .moon{animation:drift 6s ease-in-out infinite alternate}
.ic .tw{animation:tw 2.4s ease-in-out infinite}
.ic .fogl{animation:fogl 3.5s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes drift{to{transform:translateX(3px)}}
@keyframes drop{0%{transform:translate(0,-5px);opacity:0}25%{opacity:1}100%{transform:translate(-3px,9px);opacity:0}}
@keyframes flake{0%{transform:translate(0,-5px);opacity:0}25%{opacity:1}100%{transform:translate(2px,11px);opacity:0}}
@keyframes flash{0%,62%,100%{opacity:0}64%,70%{opacity:1}67%{opacity:.25}}
@keyframes tw{50%{opacity:.15}}
@keyframes fogl{to{transform:translateX(-5px)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

html{scroll-behavior:smooth}
body{transition:background-color .7s}
.mt,.mt *{transition:background-color .7s var(--ease),color .7s var(--ease),border-color .7s var(--ease),box-shadow .7s!important}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
.hero{transform:translateY(calc(var(--sy,0)*.12px));opacity:calc(1 - var(--sy,0)/600)}
#clk{font-variant-numeric:tabular-nums}
.rt{display:flex;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -18px 0;padding:2px 18px}
.chips::-webkit-scrollbar{display:none}
.fc{flex:none;padding:7px 14px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-b);font-size:14px;transition:transform .35s var(--spring),background .3s}
.fc:active{transform:scale(.92)}.fc.on{background:rgba(255,255,255,.3)}
.set{flex:1;overflow-y:auto;padding:14px 0 calc(var(--sb) + 24px)}
.grp{background:var(--glass);border:1px solid var(--glass-b);border-radius:22px;margin-bottom:14px;overflow:hidden}
.srw{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;font-size:16px;border-top:1px solid rgba(128,128,128,.15);transition:background .25s}
.srw:first-child{border-top:0}.srw:active{background:rgba(128,128,128,.14)}
.srw small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.srw>span:first-child{flex:1}.srw svg{width:18px;height:18px;color:var(--faint);transition:transform .5s var(--spring)}
.srw.open svg{transform:rotate(90deg)}
.seg{display:flex;background:rgba(128,128,128,.2);border-radius:12px;padding:3px;position:relative}
.seg button{flex:1;position:relative;z-index:1;padding:7px 0;font-size:14px;border-radius:9px}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n,3));border-radius:9px;background:rgba(255,255,255,.3);box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .55s var(--spring)}
.stars{display:flex;gap:6px;justify-content:center;padding:0 0 16px}
.stars button{width:40px;height:40px;transition:transform .4s var(--spring)}
.stars button:active{transform:scale(.8)}

function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function demoWx(p){
  const now=new Date();const r=rng(hashStr(p.name+ds(now)));
  const off=Math.round(p.lon/15);
  const L=new Date(now.getTime()+now.getTimezoneOffset()*60000+off*3600000);
  const south=p.lat<0,al=Math.abs(p.lat),m=L.getMonth();
  const winterN=(m>=10||m<=2);const coldSeason=south?!winterN:winterN;
  let base=al<23?29-al*.1:(coldSeason?20-al*.36:30-al*.25);
  const dl=Math.max(7.5,Math.min(16.5,12+(coldSeason?-1:1)*Math.max(0,al-10)*.11));
  const sr=12.2-dl/2,ss=12.2+dl/2;
  const pool=al<23?[0,1,1,2,2,80,95,3]:base<4?[3,3,71,73,2,45,1,61]:[0,1,2,2,3,3,61,63,80,45];
  const d0=new Date(L.getFullYear(),L.getMonth(),L.getDate());
  const daily={time:[],weather_code:[],temperature_2m_max:[],temperature_2m_min:[],sunrise:[],sunset:[],uv_index_max:[],precipitation_probability_max:[],precipitation_sum:[],wind_speed_10m_max:[]};
  const hourly={time:[],temperature_2m:[],weather_code:[],precipitation_probability:[],is_day:[]};
  const hm=h=>`${pad(Math.floor(h))}:${pad(Math.round((h%1)*60)%60)}`;
  for(let d=0;d<14;d++){
    const dd=new Date(d0.getTime()+d*864e5),s=ds(dd);
    const code=pool[Math.floor(r()*pool.length)];const wet=code>=45;
    const mid=base+(r()-.5)*6,amp=wet?2.5:4.5;
    const mx=mid+amp,mn=mid-amp;
    daily.time.push(s);daily.weather_code.push(code);daily.temperature_2m_max.push(+mx.toFixed(1));daily.temperature_2m_min.push(+mn.toFixed(1));
    daily.sunrise.push(`${s}T${hm(sr)}`);daily.sunset.push(`${s}T${hm(ss)}`);
    daily.uv_index_max.push(+Math.max(0,(dl-7)*.9*(wet?.5:1)+(al<23?6:0)).toFixed(1));
    const pmax=wet&&code!==45?Math.round(45+r()*45):Math.round(r()*15);daily.precipitation_probability_max.push(pmax);daily.precipitation_sum.push(wet&&code!==45?+(r()*9).toFixed(1):+(r()*.4).toFixed(1));daily.wind_speed_10m_max.push(Math.round(8+r()*28));
    for(let h=0;h<24;h++){
      const t=mn+(mx-mn)*(.5-.5*Math.cos((h-4)/24*2*Math.PI));
      const isDay=h>=sr&&h<ss?1:0;
      let hc=code;if(!wet&&!isDay&&code>1)hc=r()<.5?1:code;if(wet&&r()<.25)hc=3;
      hourly.time.push(`${s}T${pad(h)}:00`);hourly.temperature_2m.push(+(t+(r()-.5)).toFixed(1));hourly.weather_code.push(hc);
      hourly.precipitation_probability.push(hc>=51?Math.round(pmax*(.6+r()*.4)):Math.round(r()*8));hourly.is_day.push(isDay);
    }
  }
  const H=L.getHours(),idx=H;
  const ct=hourly.temperature_2m[idx];
  return{current:{time:`${ds(L)}T${pad(H)}:${pad(Math.floor(L.getMinutes()/15)*15)}`,temperature_2m:ct,apparent_temperature:+(ct-1-r()*3).toFixed(1),relative_humidity_2m:Math.round(55+r()*40),is_day:hourly.is_day[idx],weather_code:hourly.weather_code[idx],wind_speed_10m:+(4+r()*22).toFixed(1),wind_direction_10m:Math.round(r()*360),pressure_msl:Math.round(1002+r()*24)},hourly,daily,_demo:true};
}

  renderSet();$('#chipw').innerHTML=chips();bindChips();toast('Přihlášen jako '+(p.name||p.email))}catch(e){toast('Přihlášení se nepovedlo')}}
function signOut(){try{google.accounts.id.disableAutoSelect()}catch(e){}S.user=null;store.set('tadx.user',null);S.favs=store.get('tadx.favs',[]);renderSet();$('#chipw').innerHTML=chips();bindChips();const b=$('#fav');if(b)b.classList.toggle('on',!!isFav(S.place));toast('Odhlášeno')}
const SV='<svg viewBox="0 0 24 24" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>';
let setPage='main';
const PT={main:'Nastavení',about:'O aplikaci'};
const segHtml=(id,o,c)=>`<div class="seg" id="${id}" style="--n:${o.length}"><i style="transform:translateX(${Math.max(0,o.findIndex(x=>x[0]===c))*100}%)"></i>${o.map(x=>`<button data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
function bindSeg(id,fn){const el=$('#'+id);el.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{vib();el.querySelector('i').style.transform=`translateX(${i*100}%)`;fn(b.dataset.v,b)})}
function renderSet(pg=setPage,dir=''){
  setPage=pg;const u=S.user,r=store.get('tadx.rate',0);
  $('#stitle').textContent=PT[pg];$('#sback').classList.toggle('hidden',pg==='main');
  let h='';
  if(pg==='main'){
    h=`<div class="slab">Účet</div><div class="grp">${u?`<div class="acc"><div class="av" style="${u.pic?`background-image:url(&quot;${esc(u.pic)}&quot;)`:''}">${u.pic?'':esc((u.name||'?')[0])}</div><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(u.name||'')}</div><div style="font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis">${esc(u.email||'')}</div></div><button class="cancel" id="so">Odhlásit</button></div>`:`<div class="acc"><div style="flex:1"><div style="font-weight:600">Přihlášení přes Google</div><div style="font-size:13px;color:var(--muted)">Ukládej oblíbené lokace do svého účtu</div></div></div><div style="padding:0 16px 16px;display:flex;justify-content:center"><div id="gbtn"></div></div>`}</div>
    <div class="slab">Vzhled a jednotky</div>
    <div class="grp">
      <div class="sr"><div class="srw"><em class="si">🌗</em><span class="tx">Režim<small>Podle systému, světlý nebo tmavý</small></span></div><div class="sc">${segHtml('segM',[['auto','Auto'],['light','Světlý'],['dark','Tmavý']],S.mode)}</div></div>
      <div class="sr"><div class="srw"><em class="si">🌡️</em><span class="tx">Jednotky<small>Teplota a rychlost větru</small></span></div><div class="sc">${segHtml('segU',[['C','°C · km/h'],['F','°F · mph']],S.unit)}</div></div>
      <div class="sr"><div class="srw"><em class="si">🕒</em><span class="tx">Hodinová předpověď<small>Posuvné karty, nebo graf</small></span></div><div class="sc">${segHtml('segH',[['list','Karty'],['graph','Graf']],S.hview)}</div></div>
      <div class="sr"><div class="srw"><em class="si">📅</em><span class="tx">Denní předpověď<small>Kolik dní se zobrazí</small></span></div><div class="sc">${segHtml('segD',[['7','7 dní'],['14','14 dní']],String(S.days))}</div></div>
    </div>
    <div class="slab">Aplikace</div>
    <div class="grp">
      <button class="srw" id="sonb"><em class="si">👋</em><span class="tx">Úvod do aplikace<small>Co TadxWeather umí</small></span>${I.arrow}</button>
      <button class="srw" data-go="about"><em class="si">ℹ️</em><span class="tx">O aplikaci<small>Verze 2.7 · zdroj dat · upozornění</small></span>${I.arrow}</button>
    </div>
    <div class="slab">Hodnocení</div>
    <div class="grp"><div class="srw"><em class="si">⭐</em><span class="tx">Ohodnotit aplikaci<small>Jak se ti TadxWeather líbí?</small></span></div><div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${n<=r?'on':''}">${SV}</button>`).join('')}</div></div>`;
  }else{
    h=`<div class="abt-hero">${icon(2,1).replace('class="ic"','class="ic ab-logo"')}<div class="ab-name">Tadx<b>Weather</b></div><div class="ab-ver">Verze 2.7</div></div>
    <div class="grp"><div class="abt-text">TadxWeather ukazuje aktuální počasí, hodinovou a 7denní předpověď pro libovolné město na světě, včetně kvality ovzduší, životního indexu a fáze Měsíce. Oblíbená místa se ukládají v tomto zařízení, případně pod tvým Google účtem.</div></div>
    <div class="grp"><div class="srw"><span class="tx">Zdroj dat<small>Open-Meteo.com (CC BY 4.0)</small></span></div><div class="srw"><span class="tx">Upozornění<small>Vychází z předpovědi, nejde o oficiální výstrahy</small></span></div></div>`;
  }
  $('#setBody').innerHTML=`<div class="pg ${dir}">${h}</div>`;
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{vib();renderSet(b.dataset.go,'fwd')});
  if(pg==='main'){
    if(!u){const g=$('#gbtn');if(GOOGLE_CLIENT_ID){loadGsi().then(()=>{google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:gcb});google.accounts.id.renderButton(g,{theme:'outline',size:'large',shape:'pill',width:260,locale:'cs'})}).catch(()=>toast('Google přihlášení není dostupné'))}else{g.innerHTML='<button class="gfake">Přihlásit přes Google</button>';g.firstChild.onclick=()=>toast('Nejdřív vlož Google Client ID do kódu (GOOGLE_CLIENT_ID)')}}
    else $('#so').onclick=signOut;
    $('#sonb').onclick=()=>{closeSet();setTimeout(showOnb,450)};
    bindSeg('segM',(m,b)=>{const rc=b.getBoundingClientRect();setMode(m,rc.left+rc.width/2,rc.top+rc.height/2)});
    bindSeg('segU',setUnit);bindSeg('segH',setHview);bindSeg('segD',setDays);
    document.querySelectorAll('#stars button').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;store.set('tadx.rate',n);vib();document.querySelectorAll('#stars button').forEach((x,i)=>{x.classList.remove('on','pop');if(i<n)setTimeout(()=>{x.classList.add('on','pop')},i*90)});toast(n>=4?'Děkujeme za skvělé hodnocení! ★':'Díky za zpětnou vazbu, zlepšíme se')});
  }
}
const setEl=$('#set');
function openSet(){renderSet('main','');setEl.classList.add('open');setEl.setAttribute('aria-hidden','false');vib()}
function closeSet(){setEl.classList.remove('open');setEl.setAttribute('aria-hidden','true')}
$('#btnSet').onclick=openSet;setEl.querySelectorAll('[data-sclose]').forEach(e=>e.onclick=closeSet);
const dsh=$('#dsheet');
function openDay(i){const d=S.data;if(!d)return;const dl=d.daily,[lab]=wmo(dl.weather_code[i]);
  const sr=mins(dl.sunrise[i]),ss=mins(dl.sunset[i]),mm=dl.precipitation_sum?dl.precipitation_sum[i]:null,wv=dl.wind_speed_10m_max?dl.wind_speed_10m_max[i]:null;
  const rain=mm==null?'–':S.unit==='C'?mm.toFixed(1)+' mm':(mm*.0394).toFixed(2)+' in',wind=wv==null?'–':S.unit==='C'?Math.round(wv)+' km/h':Math.round(wv*.621)+' mph',uvv=dl.uv_index_max[i]??0;
  $('#dtitle').textContent=i?cap(pdate(dl.time[i]).toLocaleDateString('cs-CZ',{weekday:'long',day:'numeric',month:'long'})):'Dnes';
  const tile=(a,b)=>`<div class="dt"><small>${a}</small><b>${b}</b></div>`;
  $('#dBody').innerHTML=`<div style="text-align:center;padding:6px 0"><div style="width:100px;height:100px;margin:0 auto">${icon(dl.weather_code[i],1)}</div><div style="font-size:20px;margin-top:4px">${lab}</div><div style="color:var(--muted);margin-top:4px">↑ ${T(dl.temperature_2m_max[i])}° · ↓ ${T(dl.temperature_2m_min[i])}°</div></div><div class="card" style="margin:12px 0 0"><div class="card-h">${I.thermo}Průběh teploty</div>${chartSvg(d,i*24,false,24)}</div><div class="parts">${[['Noc',0],['Ráno',6],['Odpoledne',14],['Večer',20]].map(([n,h])=>{const j=i*24+h;return d.hourly.time[j]==null?'':`<div><small>${n}</small>${icon(d.hourly.weather_code[j],h>=7&&h<=17?1:0)}<b>${T(d.hourly.temperature_2m[j])}°</b></div>`}).join('')}</div><div class="dgrid">${tile('Srážky',rain)}${tile('Pravděpodobnost srážek',(dl.precipitation_probability_max[i]??0)+' %')}${tile('Max. vítr',wind)}${tile('UV index',Math.round(uvv)+' · '+uvLabel(uvv))}${tile('Východ slunce',hhmm(dl.sunrise[i]))}${tile('Západ slunce',hhmm(dl.sunset[i]))}${tile('Délka dne',fmtDur(ss-sr))}</div>`;
  curDay=i;$('#dprev').disabled=i<=0;$('#dnext').disabled=i>=Math.min(S.days,dl.time.length)-1;dsh.classList.add('open');dsh.setAttribute('aria-hidden','false');vib()}
let curDay=0;
function stepDay(k){const n=Math.min(S.days,S.data.daily.time.length),i=curDay+k;if(i<0||i>=n)return;openDay(i)}
function closeDay(){dsh.classList.remove('open');dsh.setAttribute('aria-hidden','true')}
dsh.querySelectorAll('[data-dclose]').forEach(e=>e.onclick=closeDay);$('#dprev').onclick=()=>stepDay(-1);$('#dnext').onclick=()=>stepDay(1);
function dragClose(sh,fn){const pn=sh.querySelector('.panel'),gb=sh.querySelector('.grab');let y0=null,dy=0;
  gb.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;dy=0;pn.style.transition='none'},{passive:true});
  gb.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);pn.style.transform=`translateY(${dy}px)`;e.preventDefault()},{passive:false});
  const end=()=>{if(y0==null)return;const c=dy>110;y0=null;pn.style.transition='';pn.style.transform='';if(c)fn()};
  gb.addEventListener('touchend',end);gb.addEventListener('touchcancel',end)}
dragClose(sheet,closeSheet);dragClose(setEl,closeSet);$('#sback').onclick=()=>{vib();renderSet('main','back')};dragClose(dsh,closeDay);
applyMode();if(S.user)S.favs=store.get('tadx.favs.'+S.user.sub,[]);


/* ---------- embed mapy ---------- */
function mapSrc(l){const p=S.place,la=p.lat.toFixed(3),lo=p.lon.toFixed(3),c=S.unit==='C';
  return`https://embed.windy.com/embed2.html?lat=${la}&lon=${lo}&detailLat=${la}&detailLon=${lo}&zoom=7&level=surface&overlay=${l}&product=${l==='radar'?'radar':'ecmwf'}&menu=&message=&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=${c?'km%2Fh':'mph'}&metricTemp=${c?'%C2%B0C':'%C2%B0F'}&radarRange=-1`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-map]');if(!b||!S.place)return;
  const l=b.dataset.map,box=$('#mapbox');if(!box)return;vib();
  document.querySelectorAll('#mapchips button').forEach(x=>x.classList.toggle('on',x.dataset.map===l));
  let f=box.querySelector('iframe');
  if(!f){box.innerHTML='<iframe title="Mapa počasí" loading="lazy" allowfullscreen referrerpolicy="no-referrer"></iframe>';f=box.querySelector('iframe')}
  f.src=mapSrc(l)});
/* ---------- gesta ---------- */
(function(){const ind=document.createElement('div');ind.id='ptr';ind.innerHTML=I.ref;document.body.appendChild(ind);
  let y0=null,dy=0;
  addEventListener('touchstart',e=>{y0=scrollY<=0&&!document.querySelector('.sheet.open')&&!$('#onb').classList.contains('show')?e.touches[0].clientY:null;dy=0},{passive:true});
  addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){const v=Math.min(dy,110);ind.style.opacity=Math.min(1,v/70);ind.style.transform=`translate(-50%,${v*.6}px) rotate(${v*3}deg)`}},{passive:true});
  addEventListener('touchend',()=>{if(y0==null)return;const go=dy>80&&S.place;y0=null;
    if(go){vib();ind.classList.add('spin');ind.style.transform='translate(-50%,44px)';load(S.place,true).finally(()=>{ind.classList.remove('spin');ind.style.opacity=0;ind.style.transform='translate(-50%,0)'})}
    else{ind.style.opacity=0;ind.style.transform='translate(-50%,0)'}});
  let sx=null,sy=0;const mn=$('#main');
  mn.addEventListener('touchstart',e=>{sx=e.target.closest('.hours,.lfc,.chips,.chart')?null:e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  mn.addEventListener('touchend',e=>{if(sx==null||!S.favs.length)return;const dx=e.changedTouches[0].clientX-sx,dv=Math.abs(e.changedTouches[0].clientY-sy);sx=null;if(Math.abs(dx)<90||dv>50)return;
    const n=S.favs.length;let i=S.favs.findIndex(f=>S.place&&Math.abs(f.lat-S.place.lat)<.01&&Math.abs(f.lon-S.place.lon)<.01);
    i=i<0?(dx<0?0:n-1):(i+(dx<0?1:-1)+n)%n;vib();S.lastTemp=null;load(S.favs[i])},{passive:true});
})();

/* ---------- onboarding ---------- */
const OB=[
 {ic:()=>icon(2,1),t:'Vítej v TadxWeather',p:'Přehledné a rychlé počasí pro libovolné město na světě. Bez účtu a bez zbytečností.'},
 {ic:()=>icon(0,1),t:'Co všechno umí',list:[['🌡️','Aktuální počasí a pocitová teplota'],['🕒','Hodinová a 7denní předpověď'],['📈','Graf teploty a srážek'],['🌿','Životní index, ovzduší a fáze Měsíce'],['⚠️','Upozornění na bouřky, mráz nebo vítr']]},
 {ic:()=>icon(63,1),t:'Hledej a ukládej',list:[['🔍','Vyhledej jakékoli město na světě'],['📍','Použij svoji aktuální polohu'],['⭐','Ulož si oblíbená místa jedním klepnutím'],['👆','Přejetím doleva a doprava měníš oblíbená města'],['📴','Bez internetu uvidíš poslední předpověď']]},
 {ic:()=>icon(0,0),t:'Přizpůsob si ji',p:'V Nastavení → Přizpůsobení zvolíš tmavý nebo světlý režim, °C nebo °F a jestli chceš hodinovou předpověď jako karty, nebo jako graf.'}
];
let obI=0;
function showOnb(){
  const el=$('#onb');obI=0;
  el.innerHTML=`<button class="ob-skip" id="obSkip">Přeskočit</button><div class="ob-view"><div class="ob-track" id="obT">${OB.map(o=>`<section class="ob-pg${o.list?' l':''}"><div class="ob-art">${o.ic()}</div><h2>${o.t}</h2>${o.p?`<p>${o.p}</p>`:''}${o.list?`<ul>${o.list.map(x=>`<li><span>${x[0]}</span>${x[1]}</li>`).join('')}</ul>`:''}</section>`).join('')}</div></div><div class="ob-foot"><div class="dots" id="obD">${OB.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div><button class="ob-btn" id="obN">Další</button></div>`;
  el.classList.remove('hidden','show');setTimeout(()=>el.classList.add('show'),30);
  const go=i=>{obI=Math.max(0,Math.min(OB.length-1,i));$('#obT').style.transform=`translateX(${-obI*100}%)`;[...$('#obD').children].forEach((d,k)=>d.classList.toggle('on',k===obI));$('#obN').textContent=obI===OB.length-1?'Začít':'Další'};
  const end=()=>{store.set('tadx.onb',1);el.classList.remove('show');setTimeout(()=>el.classList.add('hidden'),650)};
  $('#obN').onclick=()=>obI===OB.length-1?end():go(obI+1);$('#obSkip').onclick=end;
  [...$('#obD').children].forEach((d,k)=>d.onclick=()=>go(k));
  let x0=null;el.ontouchstart=e=>{x0=e.touches[0].clientX};el.ontouchend=e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)go(obI+(dx<0?1:-1))};
}

/* ---------- boot ---------- */
function hideSplash(){const s=$('#splash');if(!s.classList.contains('out'))setTimeout(()=>s.classList.add('out'),Math.max(0,1300-(performance.now()-t0)))}
const t0=performance.now();
$('#spLogo').outerHTML=icon(2,1).replace('class="ic"','class="ic sp-logo"');
$('#brandLogo').outerHTML=icon(2,1);
$('#spName').innerHTML=[...'Tadx'].map((c,i)=>`<span style="animation-delay:${.3+i*.05}s">${c}</span>`).join('')+[...'Weather'].map((c,i)=>`<span style="animation-delay:${.5+i*.05}s"><b>${c}</b></span>`).join('');
if(!store.get('tadx.onb'))showOnb();
setTheme('clear-night');requestAnimationFrame(loop);setTimeout(()=>$('#splash').classList.add('out'),9000);
load(store.get('tadx.last',null)||CITIES[0]);
})();
</script>
